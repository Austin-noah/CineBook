services:
  - type: web
    name: cinebook
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: cinebook.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://cinebook.onrender.com
