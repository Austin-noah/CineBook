{% extends 'movies/base.html' %}

{% block title %}Page not found | CineBook{% endblock %}

{% block content %}
<div class="container-xl page-shell">
    <div class="empty-state">
        <span class="eyebrow">SCENE NOT FOUND</span>

    </div>
</div>
{% endblock %}
